<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SwiftSpot: a white eighth note on an orange to violet tile. -->
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="0.48" stop-color="#FF3F6C"/>
      <stop offset="1" stop-color="#6A2BE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- The body, on the macOS icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g fill="#FFFFFF">
    <ellipse cx="448" cy="676" rx="118" ry="92" transform="rotate(-22 448 676)"/>
    <rect x="522" y="270" width="46" height="360" rx="23"/>
    <path d="M545 270 C 610 300, 700 340, 712 430 C 718 480, 696 520, 668 548 C 690 500, 684 440, 640 410 C 610 390, 580 384, 568 384 Z"/>
